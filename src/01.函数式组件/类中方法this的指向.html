<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        class Person{
            constructor(name,age){
                this.name=name;
                this.age=age;
            }
            speak(){
                console.log(this);
            }
        }
        const p1=new Person('TOM',18);
        // 类中的方法默认开启严格模式，this为undefined
        p1.speak();
    </script>
</body>
</html>
